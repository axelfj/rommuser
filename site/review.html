rs that invite you to close your eyes.&lt;/p&gt;&lt;p class=&quot;artist-manifesto&quot;&gt;The music already exists. ROMMUSER tunes into it and brings it down to earth.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cosmic-heading&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;GROOVE / TENSION / MELODY&lt;/p&gt;&lt;h2&gt;TUNE IN.&lt;/h2&gt;&lt;p class=&quot;signal-intro&quot;&gt;Three ways into the same night.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;tuning-controls&quot; role=&quot;group&quot; aria-label=&quot;Choose a signal&quot;&gt;&lt;button type=&quot;button&quot; data-signal=&quot;groove&quot; aria-pressed=&quot;true&quot;&gt;GROOVE&lt;/button&gt;&lt;button type=&quot;button&quot; data-signal=&quot;tension&quot; aria-pressed=&quot;false&quot;&gt;TENSION&lt;/button&gt;&lt;button type=&quot;button&quot; data-signal=&quot;melody&quot; aria-pressed=&quot;false&quot;&gt;MELODY&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;signal-stories&quot; aria-live=&quot;polite&quot;&gt;&lt;div data-story=&quot;groove&quot;&gt;&lt;span class=&quot;eyebrow&quot;&gt;YOUR BODY&lt;/span&gt;&lt;p&gt;The bass sets the space. The drums move you.&lt;/p&gt;&lt;a class=&quot;text-link&quot; href=&quot;#track-never-be&quot;&gt;LISTEN TO NEVER BE ↗&lt;/a&gt;&lt;/div&gt;&lt;div data-story=&quot;tension&quot; hidden&gt;&lt;span class=&quot;eyebrow&quot;&gt;THE NIGHT&lt;/span&gt;&lt;p&gt;Darkness, repetition. A pulse that holds.&lt;/p&gt;&lt;a class=&quot;text-link&quot; href=&quot;#track-echoes&quot;&gt;LISTEN TO ECHOES ↗&lt;/a&gt;&lt;/div&gt;&lt;div data-story=&quot;melody&quot; hidden&gt;&lt;span class=&quot;eyebrow&quot;&gt;WHAT REMAINS&lt;/span&gt;&lt;p&gt;A melody that stays with you after the last beat.&lt;/p&gt;&lt;a class=&quot;text-link&quot; href=&quot;#track-dont-wanna&quot;&gt;DISCOVER DON&#x27;T WANNA ↗&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;figure class=&quot;cosmic-scene&quot; aria-label=&quot;A visual interpretation of groove, tension and melody&quot;&gt;&lt;canvas id=&quo
