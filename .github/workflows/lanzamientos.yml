name: Lanzamientos

# Every day at 00:05 Costa Rica time (06:05 UTC), reveal the releases whose day has come
# (scripts/lanzamientos.json) and push the change to main, which redeploys rommuser.com.
on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lanzamientos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/publicar-lanzamientos.mjs
      - name: Publicar en main
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Lanzamiento: revelar el release de hoy en rommuser.com"
          git push origin main
